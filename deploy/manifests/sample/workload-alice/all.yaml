apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: appnet
spec:
  controllerName: gateway.azure.com/appnet-gateway.controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: demo
spec:
  gatewayClassName: appnet
  tls:
    backend:
      clientCertificateRef:
        group: ""
        kind: Secret
        name: alice-backend-mtls
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-nginx
  namespace: demo
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/mtls/tls.crt;
        ssl_certificate_key /etc/nginx/mtls/tls.key;
        ssl_client_certificate /etc/nginx/mtls/ca.crt;
        ssl_verify_client on;
        location / {
          add_header Content-Type text/plain;
          return 200 'hello-from-alice';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
      - name: echo
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: mtls
          mountPath: /etc/nginx/mtls
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: echo-nginx
      - name: mtls
        secret:
          secretName: echo-mtls-server
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: demo
spec:
  selector: { app: echo }
  ports:
  - port: 8443
    targetPort: 8443
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: demo
spec:
  parentRefs:
  - name: demo-gw
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo
      port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: echo-mtls
  namespace: demo
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: echo
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: alice-backend-mtls
    hostname: echo.demo.svc.cluster.local
