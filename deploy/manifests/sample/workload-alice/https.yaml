# HTTPS variant of the alice member-cluster sample. The Gateway carries the
# `appnet.azure.com/tls-cert` annotation naming an infra-cluster Secret;
# the member cluster never holds cert material.
#
# Apply with: kubectl --context aks-workload-alice apply -f https.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: demo
  annotations:
    appnet.azure.com/tls-cert: alice-https-cert
spec:
  gatewayClassName: appnet
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  - name: https
    hostname: demo.example.com
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      # Gateway-API CRD requires certificateRefs OR options under mode=Terminate.
      # The member cluster has no Secret; the value here just satisfies the
      # schema. The controller reads the cert NAME from the
      # `appnet.azure.com/tls-cert` annotation above and resolves it to an
      # infra-cluster Secret.
      options:
        appnet.azure.com/tls-cert: alice-https-cert
