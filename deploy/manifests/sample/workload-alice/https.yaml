# HTTPS variant of the alice member-cluster sample. certificateRefs name
# infra-cluster Secrets mounted only into tenant Istiod; the member cluster never
# holds frontend cert material.
#
# Apply with: kubectl --context aks-workload-alice apply -f https.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: demo
spec:
  gatewayClassName: appnet
  tls:
    backend:
      clientCertificateRef:
        group: ""
        kind: Secret
        name: alice-backend-mtls
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  - name: https
    hostname: demo.example.com
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: alice-https-cert
