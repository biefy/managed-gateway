# Self-signed TLS certificate for demo.example.com used by the alice HTTPS
# sample. This Secret MUST live ONLY in the infra cluster's tenant-alice
# namespace and never be applied to a member cluster.
#
# Apply with: kubectl --context aks-infra apply -f alice-https-cert.yaml
apiVersion: v1
kind: Secret
metadata:
  name: alice-https-cert
  namespace: tenant-alice
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
