# Ambient-mesh install for an AKS member cluster.
#
# Contains:
#   - istiod Service + Endpoints in istio-system, routing to the tenant istiod
#     internal LoadBalancer in the infra cluster.
#   - istio-cni DaemonSet (ambient mode).
#   - ztunnel DaemonSet (mTLS xDS to the cross-cluster istiod) with root CA
#     mounted from Azure Key Vault through Secrets Store CSI.
---
apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app: istiod
spec:
  ports:
    - name: grpc-xds
      port: 15010
      targetPort: 15010
    - name: grpc-xds-tls
      port: 15012
      targetPort: 15012
---
apiVersion: v1
kind: Endpoints
metadata:
  name: istiod
  namespace: istio-system
subsets:
  - addresses:
      - ip: __INFRA_NODE_IP__
    ports:
      - name: grpc-xds
        port: __ISTIOD_PLAINTEXT_NODEPORT__
      - name: grpc-xds-tls
        port: __ISTIOD_TLS_NODEPORT__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-cni
  namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: istio-cni
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: istio-cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: istio-cni
subjects:
  - kind: ServiceAccount
    name: istio-cni
    namespace: istio-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-cni-config
  namespace: istio-system
data:
  cni_network_config: |-
    {
      "cniVersion": "0.3.1",
      "name": "istio-cni",
      "type": "istio-cni",
      "plugin_log_level": "info",
      "cni_agent_run_dir": "/var/run/istio-cni",
      "ambient_enabled": true,
      "exclude_namespaces": ["istio-system", "kube-system"]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: istio-cni-node
  namespace: istio-system
  labels:
    k8s-app: istio-cni-node
spec:
  selector:
    matchLabels:
      k8s-app: istio-cni-node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        k8s-app: istio-cni-node
        sidecar.istio.io/inject: "false"
        istio.io/dataplane-mode: none
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      serviceAccountName: istio-cni
      terminationGracePeriodSeconds: 5
      containers:
        - name: install-cni
          image: gcr.io/istio-testing/install-cni:latest
          command: ["install-cni"]
          args: ["--log_output_level=info"]
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          ports:
            - containerPort: 15014
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          env:
            - name: CHAINED_CNI_PLUGIN
              value: "true"
            - name: EXCLUDED_NAMESPACES
              value: "istio-system,kube-system"
            - name: CNI_NETWORK_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: istio-cni-config
                  key: cni_network_config
            - name: CNI_NET_DIR
              value: /etc/cni/net.d
            - name: AMBIENT_ENABLED
              value: "true"
            - name: AMBIENT_ENABLEMENT_SELECTOR
              value: '[{"namespaceSelector":{"matchLabels":{"istio.io/dataplane-mode":"ambient"}}},{"podSelector":{"matchLabels":{"istio.io/dataplane-mode":"ambient"}}}]'
            - name: AMBIENT_DNS_CAPTURE
              value: "false"
            - name: AMBIENT_IPV6
              value: "true"
            - name: REPAIR_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: REPAIR_RUN_AS_DAEMON
              value: "true"
            - name: REPAIR_SIDECAR_ANNOTATION
              value: sidecar.istio.io/status
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - mountPath: /host/opt/cni/bin
              name: cni-bin-dir
            - mountPath: /host/proc
              name: cni-host-procfs
              readOnly: true
            - mountPath: /host/etc/cni/net.d
              name: cni-net-dir
            - mountPath: /var/run/istio-cni
              name: cni-socket-dir
            - mountPath: /host/var/run/netns
              name: cni-netns-dir
              mountPropagation: HostToContainer
            - mountPath: /var/run/ztunnel
              name: cni-ztunnel-sock-dir
      volumes:
        - name: cni-bin-dir
          hostPath: { path: /opt/cni/bin }
        - name: cni-host-procfs
          hostPath: { path: /proc }
        - name: cni-net-dir
          hostPath: { path: /etc/cni/net.d }
        - name: cni-socket-dir
          hostPath: { path: /var/run/istio-cni }
        - name: cni-netns-dir
          hostPath: { path: /var/run/netns }
        - name: cni-ztunnel-sock-dir
          hostPath: { path: /var/run/ztunnel }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztunnel
  namespace: istio-system
  annotations:
    azure.workload.identity/client-id: __WORKLOAD_IDENTITY_CLIENT_ID__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztunnel
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [security.istio.io]
    resources: [peerauthentications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztunnel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztunnel
subjects:
  - kind: ServiceAccount
    name: ztunnel
    namespace: istio-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ztunnel
  namespace: istio-system
  labels:
    app: ztunnel
spec:
  updateStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ztunnel
  template:
    metadata:
      labels:
        app: ztunnel
        sidecar.istio.io/inject: "false"
        istio.io/dataplane-mode: none
        azure.workload.identity/use: "true"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: ztunnel
      tolerations:
        - operator: Exists
      containers:
        - name: istio-proxy
          image: gcr.io/istio-testing/ztunnel:latest
          ports:
            - containerPort: 15020
              name: ztunnel-stats
          securityContext:
            allowPrivilegeEscalation: true
            privileged: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
            readOnlyRootFilesystem: true
            runAsGroup: 1337
            runAsNonRoot: false
            runAsUser: 0
          readinessProbe:
            httpGet:
              port: 15021
              path: /healthz/ready
          args: [proxy, ztunnel]
          env:
            - name: CA_ADDRESS
              value: "istiod.istio-system.svc:15012"
            - name: XDS_ADDRESS
              value: "istiod.istio-system.svc:15012"
            - name: CA_ROOT_CA
              value: "/var/run/secrets/istio/root-cert.pem"
            - name: XDS_ROOT_CA
              value: "/var/run/secrets/istio/root-cert.pem"
            - name: RUST_LOG
              value: info
            - name: RUST_BACKTRACE
              value: "1"
            - name: ISTIO_META_CLUSTER_ID
              value: "__CA_CLUSTER_ID__"
            - name: CA_HEADER_clusterid
              value: "__CA_CLUSTER_ID__"
            - name: AUTH_TOKEN
              value: /var/run/secrets/tokens/istio-token
            - name: INPOD_ENABLED
              value: "true"
            - name: TERMINATION_GRACE_PERIOD_SECONDS
              value: "30"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: INSTANCE_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: istio-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: istiod-ca-cert
              mountPath: /var/run/secrets/istio
              readOnly: true
            - name: cni-ztunnel-sock-dir
              mountPath: /var/run/ztunnel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: istio-token
          projected:
            sources:
              - serviceAccountToken:
                  path: istio-token
                  expirationSeconds: 43200
                  audience: istio-ca
        - name: istiod-ca-cert
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: istio-root-cert-keyvault
        - name: cni-ztunnel-sock-dir
          hostPath:
            path: /var/run/ztunnel
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
