apiVersion: v1
kind: ServiceAccount
metadata:
  name: eastwest-gateway
  namespace: istio-system
  annotations:
    azure.workload.identity/client-id: __WORKLOAD_IDENTITY_CLIENT_ID__
  labels:
    app: eastwest-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eastwest-gateway-config
  namespace: istio-system
data:
  config.yaml: |-
    binds:
      - port: 15443
        tunnelProtocol: hboneGateway
        listeners:
          - name: hbone
            protocol: HBONE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eastwest-gateway
  namespace: istio-system
  labels:
    app: eastwest-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eastwest-gateway
  template:
    metadata:
      labels:
        app: eastwest-gateway
        sidecar.istio.io/inject: "false"
        istio.io/dataplane-mode: none
        azure.workload.identity/use: "true"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: eastwest-gateway
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: agentgateway
          image: __AGENTGATEWAY_IMAGE__
          imagePullPolicy: Always
          env:
            - name: LOCAL_XDS_PATH
              value: /etc/agentgateway/config.yaml
            - name: XDS_ADDRESS
              value: https://istiod.istio-system.svc:15012
            - name: XDS_ROOT_CA
              value: /var/run/secrets/istio/root-cert.pem
            - name: NAMESPACE
              value: istio-system
            - name: GATEWAY
              value: eastwest-gateway
            - name: CLUSTER_ID
              value: __CLUSTER_ID__
            - name: CA_CLUSTER_ID
              value: __CA_CLUSTER_ID__
            - name: NETWORK
              value: __NETWORK__
            - name: IPV6_ENABLED
              value: "false"
            - name: CA_ADDRESS
              value: https://istiod.istio-system.svc:15012
            - name: CA_ROOT_CA
              value: /var/run/secrets/istio/root-cert.pem
            - name: SERVICE_ACCOUNT
              value: eastwest-gateway
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - containerPort: 15443
              name: hbone-mtls
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
              readOnly: true
            - name: istio-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: istiod-ca-cert
              mountPath: /var/run/secrets/istio
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 1337
            runAsNonRoot: true
            runAsUser: 1337
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: eastwest-gateway-config
        - name: istio-token
          projected:
            sources:
              - serviceAccountToken:
                  path: istio-token
                  expirationSeconds: 43200
                  audience: istio-ca
        - name: istiod-ca-cert
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: istio-root-cert-keyvault
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eastwest-gateway
  namespace: istio-system
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    traffic.istio.io/nodeSelector: "{}"
  labels:
    app: eastwest-gateway
    topology.istio.io/network: __NETWORK__
    networking.istio.io/gatewayPort: "443"
spec:
  type: LoadBalancer
  selector:
    app: eastwest-gateway
  ports:
    - name: hbone-mtls
      port: 443
      targetPort: 15443
      protocol: TCP
